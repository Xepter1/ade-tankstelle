server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Statische Assets: immer revalidieren (ETag/Last-Modified -> 304 wenn
    # unverändert). So sind Änderungen nach "Pull and redeploy" sofort sichtbar
    # und werden nicht tagelang aus dem Browser-Cache ausgeliefert.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    # Schöne URLs (z. B. /impressum -> /impressum.html)
    # HTML nie cachen: immer frisch ausliefern, damit die per Cache-Busting
    # versionierten Asset-URLs (styles.css?v=…) sofort bei allen ankommen.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
