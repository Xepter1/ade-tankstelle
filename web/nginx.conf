server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Statische Assets: immer revalidieren (ETag/Last-Modified -> 304 wenn
    # unverändert). So sind Änderungen nach "Pull and redeploy" sofort sichtbar
    # und werden nicht tagelang aus dem Browser-Cache ausgeliefert.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    # Kontaktformular -> Node-Backend
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Schöne URLs (z. B. /impressum -> /impressum.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
