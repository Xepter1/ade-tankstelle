services:
  web:
    build: ./web
    # Lokal bauen statt aus Registry pullen (Portainer "Pull and redeploy")
    pull_policy: build
    restart: unless-stopped
    ports:
      # Host-Port (in Portainer/.env via WEB_PORT überschreibbar), Standard 8080
      - "${WEB_PORT:-8080}:80"

# Hinweis: Reine statische Seite (nginx). Das Kontaktformular wurde durch einen
# mailto:-Link ersetzt – es gibt kein Node-/SMTP-Backend mehr (Ordner api/ ungenutzt).
